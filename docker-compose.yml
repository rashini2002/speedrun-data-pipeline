
services:
  postgres:
    image: postgres:16
    container_name: speedrun_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: speedrun_admin
      POSTGRES_PASSWORD: speedrun_pass
      POSTGRES_DB: speedrun_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: speedrun_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: